# Local test environment only (BUDG-1, ADR-2). Ports bound to 127.0.0.1.
name: budgeta-emulators
services:
  firebase-emulators:
    build: ./docker/firebase-emulators
    image: budgeta-firebase-emulators:14.17.0
    ports:
      - "127.0.0.1:9099:9099"
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:4000:4000"
    volumes:
      - ./firebase.emulators.json:/workspace/firebase.emulators.json:ro
      - ./firestore.rules:/workspace/firestore.rules:ro
      - ./firestore.indexes.json:/workspace/firestore.indexes.json:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/').then(()=>fetch('http://127.0.0.1:9099/')).then(()=>process.exit(0),()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 60
      start_period: 5s
